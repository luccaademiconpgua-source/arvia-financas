<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <script>
      // aplica o tema antes de desenhar a tela (evita piscar claro)
      (function () {
        var t = "escuro";
        try { t = (JSON.parse(localStorage.getItem("arvia-prefs") || "{}").state || {}).theme || "escuro"; } catch (e) {}
        if (t === "sistema") t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&display=swap" />
    <title>Arvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
